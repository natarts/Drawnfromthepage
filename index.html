<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>40 Prompts, Nov 5–Dec 14</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --night:#1b2326;
  --night-2:#243036;
  --paper:#ece4d0;
  --ink:#2a2620;
  --lamp:#e3a947;
  --mist:#9fb0b2;
  --display:"IM Fell English","Iowan Old Style",Georgia,serif;
  --body:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:#e8e2d2;font-family:var(--body);font-size:1.25rem;line-height:1.6;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
a{color:inherit}
:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}

header{max-width:46rem;margin:0 auto;padding:5.5rem 1.5rem 2.5rem;text-align:center;position:relative}
header::before{content:"";position:absolute;left:50%;top:0;width:34rem;height:26rem;max-width:100%;transform:translateX(-50%);
  background:radial-gradient(closest-side,rgba(227,169,71,.22),rgba(227,169,71,0));pointer-events:none}
h1{position:relative;font-family:var(--display);font-weight:400;font-size:clamp(3rem,12vw,6rem);line-height:1;margin:0 0 1.5rem;color:var(--paper);letter-spacing:.01em}
.sub{position:relative;font-style:italic;font-size:1.35rem;color:var(--mist);margin:0 auto;max-width:34rem}
.dates{position:relative;margin:1.25rem 0 0;font-size:1.05rem;color:var(--lamp)}

nav{max-width:40rem;margin:0 auto 3rem;padding:0 1.5rem}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:.4rem}
.grid a{aspect-ratio:1;display:grid;place-items:center;text-decoration:none;font-size:.95rem;border:1px solid #3a484e;border-radius:50%;color:var(--mist)}
.grid a.done{background:var(--lamp);border-color:var(--lamp);color:var(--night)}
.grid a:hover{border-color:var(--lamp);color:var(--paper)}
.grid a.done:hover{color:var(--night)}
@media(max-width:34rem){.grid{grid-template-columns:repeat(8,1fr)}}

main{max-width:46rem;margin:0 auto;padding:0 1.5rem 6rem}
.part{font-family:var(--display);font-size:1.7rem;font-style:italic;color:var(--lamp);text-align:center;margin:5rem 0 3rem;
  display:flex;align-items:center;gap:1.2rem}
.part::before,.part::after{content:"";flex:1;height:1px;background:#3a484e}
.part span{text-align:center}

article{margin:0 0 6rem;scroll-margin-top:2rem}
.frame{background:var(--paper);padding:clamp(.6rem,2.5vw,1.2rem);box-shadow:0 18px 40px rgba(0,0,0,.45)}
.frame img{display:block;width:100%;height:auto}
.empty{aspect-ratio:4/3;display:grid;place-items:center;text-align:center;color:#b9ae93;border:1px dashed #b9ae93;
  font-family:var(--display);font-size:clamp(2rem,9vw,3.6rem);padding:1rem}
.empty small{display:block;font-family:var(--body);font-style:italic;font-size:1.05rem;margin-top:.4rem}
.day{margin:1.6rem 0 .1rem;color:var(--mist);font-size:1.05rem;font-style:italic}
h2{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,8vw,3.2rem);line-height:1.1;margin:0 0 .3rem;color:var(--paper)}
.by{margin:0 0 1.6rem;color:var(--lamp);font-style:italic}
.poem{white-space:pre-line;margin:0;padding-left:1.2rem;border-left:2px solid var(--lamp);max-width:34rem;font-size:1.3rem}
.poem.none{color:#6f8084;font-style:italic}

footer{text-align:center;padding:0 1.5rem 4rem;color:var(--mist);font-style:italic}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <h1>40 Prompts<br>Nov 5–Dec 14</h1>
  <p class="sub">A 40-day drawing and poetry challenge, with prompts inspired by the books of G. K. Chesterton, Bram Stoker and Elizabeth Enright.</p>
</header>

<nav aria-label="Jump to a day"><div class="grid" id="grid"></div></nav>
<main id="main"></main>
<footer>Drawings and poems by Nathaniel Pierpont</footer>

<script>
/* ============================================================
   HOW TO ADD YOUR WORK
   For each day, fill in:
     image: path to your drawing, e.g. "images/lantern.jpg"
     poem:  your poem (line breaks are kept; use backticks ` ` )
   Leave either blank and the page shows a placeholder.
   ============================================================ */
const entries = [
  // Chesterton / Dracula
  {date:"Nov 5",  title:"Lantern",    part:1, image:"IMG_1014.jpeg", poem:`Wind clutches the fairy light\nWhispering then moaning\nIt sways and dances\nFast flickering then glowing`},
  {date:"Nov 6",  title:"Fog",        part:1, image:"", poem:``},
  {date:"Nov 7",  title:"Umbrella",   part:1, image:"", poem:``},
  {date:"Nov 8",  title:"Hidden",     part:1, image:"", poem:``},
  {date:"Nov 9",  title:"Gargoyle",   part:1, image:"", poem:``},
  {date:"Nov 10", title:"Coach",      part:1, image:"", poem:``},
  {date:"Nov 11", title:"Windmill",   part:1, image:"", poem:``},
  {date:"Nov 12", title:"Upside-down",part:1, image:"", poem:``},
  {date:"Nov 13", title:"Disguise",   part:1, image:"", poem:``},
  {date:"Nov 14", title:"Record",     part:1, image:"", poem:``},
  {date:"Nov 15", title:"Moonlight",  part:1, image:"", poem:``},
  {date:"Nov 16", title:"Castle",     part:1, image:"", poem:``},
  {date:"Nov 17", title:"Lush",       part:1, image:"", poem:``},
  {date:"Nov 18", title:"Lamp-post",  part:1, image:"", poem:``},
  // Enright
  {date:"Nov 19", title:"Attic",      part:2, image:"", poem:``},
  {date:"Nov 20", title:"Neighbor",   part:2, image:"", poem:``},
  {date:"Nov 21", title:"Cupola",     part:2, image:"", poem:``},
  {date:"Nov 22", title:"Rowboat",    part:2, image:"", poem:``},
  {date:"Nov 23", title:"Spiderweb",  part:2, image:"", poem:``},
  {date:"Nov 24", title:"Barn",       part:2, image:"", poem:``},
  {date:"Nov 25", title:"Jalopy",     part:2, image:"", poem:``},
  {date:"Nov 26", title:"Baked",      part:2, image:"", poem:``, note:"Thanksgiving"},
  {date:"Nov 27", title:"Gone",       part:2, image:"", poem:``},
  {date:"Nov 28", title:"Dumbwaiter", part:2, image:"", poem:``},
  {date:"Nov 29", title:"Rambling",   part:2, image:"", poem:``},
  {date:"Nov 30", title:"Silo",       part:2, image:"", poem:``},
  {date:"Dec 1",  title:"Quilt",      part:2, image:"", poem:``},
  {date:"Dec 2",  title:"Piano",      part:2, image:"", poem:``},
  {date:"Dec 3",  title:"Sled",       part:2, image:"", poem:``},
  {date:"Dec 4",  title:"Berries",    part:2, image:"", poem:``},
  {date:"Dec 5",  title:"Secret Room",part:2, image:"", poem:``},
  {date:"Dec 6",  title:"Skates",     part:2, image:"", poem:``},
  {date:"Dec 7",  title:"Ginger",     part:2, image:"", poem:``},
  {date:"Dec 8",  title:"Fireplace",  part:2, image:"", poem:``},
  {date:"Dec 9",  title:"Creek",      part:2, image:"", poem:``},
  {date:"Dec 10", title:"Mittens",    part:2, image:"", poem:``},
  {date:"Dec 11", title:"Goat",       part:2, image:"", poem:``},
  {date:"Dec 12", title:"Library",    part:2, image:"", poem:``},
  {date:"Dec 13", title:"Snowdrift",  part:2, image:"", poem:``},
  {date:"Dec 14", title:"Home",       part:2, image:"", poem:``}
];

const parts = {
  1:"Chesterton and Dracula · Nov 5–18",
  2:"Enright · Nov 19–Dec 14"
};

const grid = document.getElementById("grid");
const main = document.getElementById("main");
let lastPart = 0;

entries.forEach((e,i)=>{
  const n = i+1;
  const id = "day-"+n;
  const done = e.image || e.poem.trim();

  const a = document.createElement("a");
  a.href = "#"+id; a.textContent = n; a.title = e.title;
  if(done) a.className = "done";
  grid.appendChild(a);

  if(e.part !== lastPart){
    const h = document.createElement("div");
    h.className = "part"; h.innerHTML = "<span></span>";
    h.firstChild.textContent = parts[e.part];
    main.appendChild(h); lastPart = e.part;
  }

  const art = document.createElement("article");
  art.id = id;

  const frame = document.createElement("div");
  frame.className = "frame";
  const placeholder = () => {
    const d = document.createElement("div");
    d.className = "empty";
    d.innerHTML = "<div></div>";
    d.firstChild.textContent = e.title;
    const s = document.createElement("small"); s.textContent = "drawing to come";
    d.firstChild.appendChild(s);
    return d;
  };
  if(e.image){
    const img = new Image();
    img.src = e.image; img.alt = e.title + " — drawing by Nathaniel Pierpont";
    img.onerror = () => img.replaceWith(placeholder());
    frame.appendChild(img);
  } else frame.appendChild(placeholder());
  art.appendChild(frame);

  const day = document.createElement("p");
  day.className = "day";
  day.textContent = "Day " + n + " · " + e.date + (e.note ? " · " + e.note : "");
  day.textContent = "Day " + n + ", " + e.date + (e.note ? " (" + e.note + ")" : "");
  art.appendChild(day);

  const h2 = document.createElement("h2"); h2.textContent = e.title; art.appendChild(h2);
  const by = document.createElement("p"); by.className = "by"; by.textContent = "by Nathaniel Pierpont"; art.appendChild(by);

  const poem = document.createElement("p");
  const text = e.poem.trim();
  poem.className = "poem" + (text ? "" : " none");
  poem.textContent = text || "Poem to come.";
  art.appendChild(poem);

  main.appendChild(art);
});
</script>
</body>
</html>
